name: papermind

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: papermind-backend
    restart: unless-stopped
    ports:
      - "8022:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - papermind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: papermind-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Next.js will proxy browser requests directly to the internal backend container
      - BACKEND_URL=https://api-papermind.byte10x.dev
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - papermind-network

networks:
  papermind-network:
    driver: bridge
